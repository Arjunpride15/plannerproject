{% extends "daily_planner/base.html" %}

{% load django_bootstrap5 %}


{% block page_header %}
<h2 class="aqua-font p-2">Add  a new task:</h2>
{% endblock page_header %}
{% block content %}


<form action="{% url 'daily_planner:new_task' %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add Task" %}

</form>
{% endblock content %}
