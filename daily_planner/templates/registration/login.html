{% extends 'daily_planner/base.html' %}


{% load django_bootstrap5 %}


{% block page_header %}
<h2 class="aqua-font p-2">Log in to your account.</h2>
{% endblock page_header %}

{% block content %}
  <div class="pb-4">
  <form action="{% url 'accounts:login' %}" method="POST">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Log in" %}
  </form>
  </div>
{% endblock content %}
